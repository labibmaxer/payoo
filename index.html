<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo Banking app</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

         <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class=" min-h-screen  bg-[#f4f5f7] flex justify-center  items-center">
    <form id="form">
        <div class=" h-[130px] w-[300px]  flex justify-center items-center bg-[url(./assets/bg.png)] bg-cover ml-10">
            <img src="assets/Group.png" alt="">
        </div>
        <div class="gap-1 p-10 rounded-lg bg-white  ">
            <label class ="block  font-semibold ">Mobile Number</label>
            <br>
            <input type="text" id="mobile-num" placeholder="Enter  your number" class="input bg-[#f4f5f7]"  />
            <br>
            <label class =" block font-semibold mt-1">4 digit pin</label>
            <br>
            <input type="text" id="pin-num" placeholder="Enter your pin" class="input bg-[#f4f5f7]"  />
            <button type="button" class="btn bg-[#0874F2] font-semibold text-white w-full rounded-xl mt-10" id="login">Login</button>
     
        </div>
    </form>
    <script src="script.js"></script>
</body>
</html>
